services:
  converter:
    build: .
    environment:
      FILEFLIP_TOKEN: ${FILEFLIP_TOKEN:?Set a random server token}
    networks: [private]
    read_only: true
    tmpfs:
      - /tmp:size=768m,mode=1777
      - /home/converter:size=64m,uid=10001,gid=10001
    cap_drop: [ALL]
    security_opt: [no-new-privileges:true]
    mem_limit: 3g
    pids_limit: 128
    cpus: 2
    restart: unless-stopped
  tls:
    image: caddy:2.10
    environment:
      FILEFLIP_DOMAIN: ${FILEFLIP_DOMAIN:?Set your public DNS hostname}
    ports: ["443:443", "80:80"]
    volumes:
      - ./Caddyfile:/etc/caddy/Caddyfile:ro
      - caddy_data:/data
      - caddy_config:/config
    networks: [public, private]
    restart: unless-stopped
networks:
  private:
    internal: true
  public: {}
volumes:
  caddy_data: {}
  caddy_config: {}
